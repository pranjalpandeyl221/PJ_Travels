[project]
name = "agentic-travel-planner"
version = "0.1.0"
description = "Backend-first travel planning assistant built with LangGraph and Hugging Face inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.40",
    "openai>=1.54.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.6.0",
    "requests>=2.32.0",
    "streamlit>=1.40.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
